[bar]
order = [ "Main" ]

    [bar.Main]
    end = [ "media", "tray", "network", "bluetooth", "brightness", "battery", "control-center", "session" ]
    margin_edge = 4
    margin_ends = 4
    margin_opposite_edge = 4
    start = [ "launcher", "volume", "clipboard", "notifications" ]
    thickness = 36
    widget_spacing = 12

        [bar.Main.monitor.DP-4]
        position = "left"

        [bar.Main.monitor.HDMI-A-6]
        position = "right"

[dock]
background_opacity = 1.0

[location]
address = "Montreal"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-login-box@HDMI-A-6" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-4"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-6"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-6"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-6".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[shell]
font_family = "DejaVu Sans"

[theme]
builtin = "Catppuccin"
custom_palette = "stylix"
mode = "dark"
source = "builtin"

[wallpaper.default]
path = "/nix/store/d40ca1kxfc6dpv214w0s5g4m2wwswpna-noctalia-5.3.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/d40ca1kxfc6dpv214w0s5g4m2wwswpna-noctalia-5.3.0/share/noctalia/assets/noctalia-wallpaper.png"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.launcher]
glyph = "rocket"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

    [widget.network.actions]
    right = "none"

[widget.volume]
show_label = false
